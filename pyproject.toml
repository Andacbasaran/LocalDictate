[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localdictate"
version = "1.0.0"
description = "100% offline, 0 MB VRAM, cross-platform desktop AI voice dictation studio powered by faster-whisper INT8 and optional local LLM refinement."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Andac Basaran" }
]
keywords = [
    "dictation",
    "speech-to-text",
    "whisper",
    "faster-whisper",
    "ctranslate2",
    "offline",
    "voice-typing",
    "ollama",
    "pyqt6",
    "productivity",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.7.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "faster-whisper>=1.1.0",
    "pynput>=1.7.7",
    "pyperclip>=1.9.0",
    "pillow>=10.0.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://localdictate.andacbasaran.com"
Repository = "https://github.com/Andacbasaran/LocalDictate"
Issues = "https://github.com/Andacbasaran/LocalDictate/issues"
Changelog = "https://github.com/Andacbasaran/LocalDictate/blob/main/CHANGELOG.md"

[project.gui-scripts]
localdictate = "localdictate.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [
    ".venv",
    "build",
    "dist",
    "models",
    "release_out",
    "website",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
