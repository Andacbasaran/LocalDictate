[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localdictate"
version = "0.1.0"
description = "100% offline, 0 MB VRAM, ultra-low latency desktop speech-to-text tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7.0",
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "pynput>=1.7.7",
    "pyperclip>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.gui-scripts]
localdictate = "localdictate.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
